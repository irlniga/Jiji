<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f2fd6">
<title>My Items</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #070813;
    --card: #101328;
    --line: #232850;
    --text: #eef0ff;
    --muted: #8d93c4;
    --accent: #5b3df0;
    --danger: #ff6b7a;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  header {
    background: linear-gradient(135deg, #5b3df0, #2a1a8f);
    padding: calc(28px + env(safe-area-inset-top, 0)) 20px 28px;
  }
  header h1 { margin: 0 0 4px; font-size: 2rem; }
  header p { margin: 0; opacity: .85; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .add { display: flex; gap: 10px; }
  input[type=text] {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 2px solid var(--line);
    border-radius: 14px;
    color: var(--text);
    font-size: 1rem;
    padding: 14px;
  }
  input[type=text]:focus-visible, button:focus-visible {
    outline: 3px solid #a99bff;
    outline-offset: 2px;
  }
  button {
    background: var(--accent);
    border: 0;
    border-radius: 14px;
    color: #fff;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    padding: 0 22px;
  }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .head h2 { margin: 0; font-size: 1.15rem; }
  .count { background: var(--bg); border-radius: 999px; color: var(--muted); padding: 4px 12px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    align-items: center;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 12px;
    padding: 12px 0;
  }
  li input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--ok); flex: none; }
  li span { flex: 1; overflow-wrap: anywhere; }
  li.done span { color: var(--muted); text-decoration: line-through; }
  li button.del { background: transparent; color: var(--danger); font-size: 1.2rem; padding: 6px 10px; }
  .empty { color: var(--muted); padding: 14px 0 4px; }
  .note { color: var(--muted); font-size: .85rem; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>📋 My Items</h1>
  <p>Works offline. Saved on this phone.</p>
</header>

<main>
  <div class="card">
    <div class="add">
      <input type="text" id="newItem" placeholder="Add a new item..." autocomplete="off" aria-label="New item">
      <button id="addBtn" type="button">Add</button>
    </div>
  </div>

  <div class="card">
    <div class="head">
      <h2>Saved items</h2>
      <span class="count" id="count">0</span>
    </div>
    <ul id="list"></ul>
    <p class="empty" id="empty">No items yet. Type one above and tap Add.</p>
  </div>

  <p class="note">Data stays in this browser or app. Clearing app data deletes it.</p>
</main>

<script>
  var KEY = "my-items-v1";
  var items = [];

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      items = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(items)) items = [];
    } catch (e) {
      items = [];
    }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(items));
    } catch (e) {
      alert("Could not save. Storage may be full or blocked.");
    }
  }

  function render() {
    var list = document.getElementById("list");
    list.innerHTML = "";
    items.forEach(function (item) {
      var li = document.createElement("li");
      if (item.done) li.className = "done";

      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!item.done;
      cb.setAttribute("aria-label", "Mark done");
      cb.onchange = function () { item.done = cb.checked; save(); render(); };

      var span = document.createElement("span");
      span.textContent = item.text;

      var del = document.createElement("button");
      del.className = "del";
      del.type = "button";
      del.textContent = "✕";
      del.setAttribute("aria-label", "Delete item");
      del.onclick = function () {
        items = items.filter(function (i) { return i.id !== item.id; });
        save(); render();
      };

      li.appendChild(cb);
      li.appendChild(span);
      li.appendChild(del);
      list.appendChild(li);
    });
    document.getElementById("count").textContent = items.length;
    document.getElementById("empty").style.display = items.length ? "none" : "block";
  }

  function addItem() {
    var input = document.getElementById("newItem");
    var text = input.value.trim();
    if (!text) return;
    items.unshift({ id: Date.now(), text: text, done: false });
    input.value = "";
    save(); render();
    input.focus();
  }

  document.getElementById("addBtn").onclick = addItem;
  document.getElementById("newItem").addEventListener("keydown", function (e) {
    if (e.key === "Enter") addItem();
  });

  load();
  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function () {});
    });
  }
</script>
</body>
</html>
