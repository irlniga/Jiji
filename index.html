<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Items</title>
<style>
  :root {
    --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b;
    --line: #e2e8f0; --brand: #4f46e5; --brand2: #7c3aed; --danger: #ef4444;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1020; --card: #151b2e; --text: #e8ecf5; --muted: #94a3b8; --line: #263049; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    color: #fff; padding: 28px 20px 60px;
  }
  header h1 { margin: 0; font-size: 24px; }
  header p { margin: 6px 0 0; opacity: .85; font-size: 14px; }
  main { max-width: 520px; margin: -40px auto 40px; padding: 0 14px; }
  .card {
    background: var(--card); border-radius: 18px; padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.12); margin-bottom: 14px;
  }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; padding: 13px 14px; font-size: 16px;
    border: 1.5px solid var(--line); border-radius: 12px;
    background: transparent; color: var(--text); outline: none;
  }
  input:focus { border-color: var(--brand); }
  button.add {
    padding: 0 20px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 600;
    color: #fff; background: linear-gradient(135deg, var(--brand), var(--brand2));
  }
  button.add:disabled { opacity: .6; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .top h2 { margin: 0; font-size: 16px; }
  .pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--line); color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 12px 4px; border-bottom: 1px solid var(--line); word-break: break-word;
  }
  li:last-child { border-bottom: 0; }
  .del {
    border: 0; background: transparent; color: var(--danger);
    font-size: 18px; padding: 6px 10px; border-radius: 8px;
  }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
  .banner {
    display: none; background: #fee2e2; color: #991b1b;
    padding: 12px 14px; border-radius: 12px; margin-bottom: 14px; font-size: 14px;
  }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(80px);
    background: #111827; color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 14px; transition: transform .25s; z-index: 10;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <h1>📋 My Items</h1>
  <p>Flask + SQLite, built on your phone</p>
</header>

<main>
  <div class="banner" id="banner">
    ⚠️ Server offline. Open Pydroid 3 and run <b>app.py</b>, then reload this page.
  </div>

  <div class="card">
    <div class="row">
      <input id="name" placeholder="Add a new item..." maxlength="100" autocomplete="off">
      <button class="add" id="addBtn" onclick="addItem()">Add</button>
    </div>
  </div>

  <div class="card">
    <div class="top">
      <h2>Saved items</h2>
      <span class="pill" id="count">0</span>
    </div>
    <ul id="list"></ul>
    <div class="empty" id="empty" style="display:none">No items yet. Add your first one above ✨</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  const API = "/api/items";
  const nameEl = document.getElementById("name");
  const addBtn = document.getElementById("addBtn");

  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2000);
  }

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function setOffline(off) {
    document.getElementById("banner").style.display = off ? "block" : "none";
  }

  async function load() {
    try {
      const res = await fetch(API, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const items = await res.json();
      setOffline(false);
      document.getElementById("count").textContent = items.length;
      document.getElementById("empty").style.display = items.length ? "none" : "block";
      document.getElementById("list").innerHTML = items.map(i =>
        `<li><span>${esc(i.name)}</span>
         <button class="del" onclick="removeItem(${i.id})" aria-label="Delete">🗑</button></li>`
      ).join("");
    } catch (e) {
      setOffline(true);
    }
  }

  async function addItem() {
    const name = nameEl.value.trim();
    if (!name) { toast("Type something first"); return; }
    addBtn.disabled = true;
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      nameEl.value = "";
      toast("Added ✓");
      await load();
    } catch (e) {
      setOffline(true);
      toast("Could not add: " + e.message);
    } finally {
      addBtn.disabled = false;
    }
  }

  async function removeItem(id) {
    try {
      const res = await fetch(API + "/" + id, { method: "DELETE" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      toast("Deleted");
      load();
    } catch (e) {
      setOffline(true);
      toast("Could not delete: " + e.message);
    }
  }

  nameEl.addEventListener("keydown", e => { if (e.key === "Enter") addItem(); });
  load();
</script>
</body>
</html>
